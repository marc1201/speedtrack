# The Xcode project is generated from this file (xcodegen generate); it is never committed.
name: SpeedTrack
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpeedTrack:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vc.1201.speedtrack
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Speedtrack
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  SpeedTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SpeedTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vc.1201.speedtrack.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  SpeedTrack:
    build:
      targets:
        SpeedTrack: all
    test:
      targets:
        - SpeedTrackTests
