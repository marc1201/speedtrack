# A thin wrapper: the logic lives in ci/*.sh, which can change without touching this file
# (workflow files cannot be pushed from the VPS).
name: ios

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/build-test.sh
